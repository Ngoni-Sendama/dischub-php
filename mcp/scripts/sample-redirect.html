<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dischub Payment - Redirect Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .status {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .details {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: left;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #666;
            font-weight: 500;
        }

        .detail-value {
            color: #333;
            font-weight: 600;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        .footer {
            border-top: 1px solid #e0e0e0;
            padding-top: 20px;
            color: #999;
            font-size: 12px;
        }

        .creator {
            color: #667eea;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✅</div>
        <h1>Payment Redirect</h1>
        <p class="status">This is a sample redirect page for Dischub payment testing.<br>Payment has been processed by the bank portal.</p>

        <div class="details">
            <div class="detail-row">
                <span class="detail-label">Status:</span>
                <span class="detail-value">Completed</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Order ID:</span>
                <span class="detail-value" id="orderId">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Amount:</span>
                <span class="detail-value" id="amount">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Reference:</span>
                <span class="detail-value" id="reference">-</span>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-success" onclick="returnHome()">Return Home</button>
            <button class="btn btn-secondary" onclick="viewDetails()">View Details</button>
        </div>

        <div class="footer">
            <p>Sample page created by <span class="creator">Ngonidzashe Sendama</span></p>
            <p>📱 +263783883412 | Testing MCP Server for Dischub Payments</p>
        </div>
    </div>

    <script>
        // Parse URL parameters
        const params = new URLSearchParams(window.location.search);
        document.getElementById('orderId').textContent = params.get('order_id') || 'N/A';
        document.getElementById('amount').textContent = params.get('amount') || 'N/A';
        document.getElementById('reference').textContent = params.get('ref') || 'N/A';

        function returnHome() {
            window.location.href = '/';
        }

        function viewDetails() {
            alert('Order ID: ' + (params.get('order_id') || 'N/A') + '\n' +
                  'Amount: ' + (params.get('amount') || 'N/A') + '\n' +
                  'Reference: ' + (params.get('ref') || 'N/A'));
        }
    </script>
</body>
</html>
